name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/release to create and attach the installer to (e.g. v0.1.0)"
        required: true
        default: v0.1.0

# Needed so the Actions runner can create a release and upload the installer.
permissions:
  contents: write

jobs:
  server:
    name: Server (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No committed lockfile yet, so use install (not ci). Once you run
      # `npm install` locally and commit package-lock.json, switch this to
      # `npm ci` and re-enable setup-node's npm cache.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Build Docker image
        working-directory: .
        run: docker build -t fleetwatch-server:ci ./server

  agent:
    name: Windows agent + installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained agent
        run: dotnet publish Fleetwatch.Agent.csproj -c Release -o publish
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Show publish output + Inno Setup version
        shell: cmd
        run: |
          echo --- publish dir ---
          dir publish
          echo --- ISCC version ---
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /? | more +1 | findstr /i "Inno" || ver
      - name: Compile installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\fleetwatch-agent.iss'
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetwatchAgentSetup
          path: agent-windows/Output/FleetwatchAgentSetup.exe
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # On a manual run, create (or reuse) this tag/release at the current
          # commit. On a tag push or release event, fall back to that ref.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          files: agent-windows/Output/FleetwatchAgentSetup.exe
